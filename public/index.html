<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth { margin: 24px 0; padding: 20px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth h2 { margin-top: 0; }
    .auth label { display: block; margin: 14px 0 6px; }
    .auth textarea { box-sizing: border-box; width: 100%; padding: 12px; background: #101a28; color: #ecf4ff; border: 1px solid #71869b; border-radius: 8px; font: inherit; }
    li button { margin: 12px 8px 0 0; padding: 8px 14px; cursor: pointer; }
    li span { white-space: pre-wrap; }
    [hidden] { display: none !important; }
    .auth input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #71869b; border-radius: 8px; background: #101a28; color: #ecf4ff; font: inherit; }
    .auth button { margin-top: 16px; padding: 11px 20px; border: 0; border-radius: 8px; background: #8ad8df; color: #101a28; font: inherit; cursor: pointer; }
    .auth button:disabled { opacity: .6; cursor: wait; }
    .auth [hidden] { display: none; }
    #auth-message { color: #ffe3e8; margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 5단계 자료 요청 서버 통합</div>
    <h1>점령된 자료실</h1>
    <p>로그인 후 자료를 볼 수 있습니다. 아래 기록은 모두 실습용 가상 자료입니다.</p>
    <div class="notice">서버가 로그인과 메모 소유자를 확인합니다. 본인 메모만 읽고 추가·수정·삭제할 수 있습니다.</div>
    <section class="auth" aria-labelledby="auth-heading">
      <h2 id="auth-heading">계정 로그인</h2>
      <p id="auth-status" role="status">로그인 상태를 확인하는 중입니다.</p>
      <form id="login-form">
        <label for="login-email">이메일</label>
        <input id="login-email" name="email" type="email" autocomplete="username" required>
        <label for="login-password">비밀번호</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <button id="login-button" type="submit" disabled>로그인</button>
      </form>
      <button id="logout-button" type="button" hidden>로그아웃</button>
      <p id="auth-message" role="alert" aria-live="polite"></p>
    </section>
    <section id="note-editor" class="auth" hidden aria-labelledby="note-editor-heading">
      <h2 id="note-editor-heading">가상 메모 추가</h2>
      <form id="note-form">
        <label for="note-title">제목</label><input id="note-title" maxlength="200" required>
        <label for="note-body">본문</label><textarea id="note-body" maxlength="10000" required rows="5"></textarea>
        <button id="note-save" type="submit">추가</button>
        <button id="note-cancel" type="button" hidden>수정 취소</button>
      </form>
      <p id="note-message" role="status" aria-live="polite"></p>
    </section>
    <ul id="notes" aria-live="polite"><li>로그인하면 자료를 볼 수 있습니다.</li></ul>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script type="module" src="/auth.js"></script>

</body>
</html>
